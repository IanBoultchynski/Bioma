name: Build & Deploy Bioma to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  AZURE_RESOURCE_GROUP: rg-bioma

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      owner: ${{ steps.meta.outputs.owner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute lowercase owner name
        id: meta
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push bioma-python
        uses: docker/build-push-action@v6
        with:
          context: ./backend-python
          file: ./backend-python/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/bioma-python:latest
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/bioma-python:${{ github.sha }}

      - name: Build and push bioma-api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend-csharp/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/bioma-api:latest
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/bioma-api:${{ github.sha }}

      - name: Build and push bioma-blazor
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend-blazor/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/bioma-blazor:latest
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/bioma-blazor:${{ github.sha }}

  deploy-azure:
    needs: build-and-push
    if: ${{ vars.ENABLE_AZURE_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy bioma-python
        run: |
          az containerapp update \
            --name bioma-python \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.REGISTRY }}/${{ needs.build-and-push.outputs.owner }}/bioma-python:${{ github.sha }}

      - name: Deploy bioma-api
        run: |
          az containerapp update \
            --name bioma-api \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.REGISTRY }}/${{ needs.build-and-push.outputs.owner }}/bioma-api:${{ github.sha }}

      - name: Deploy bioma-blazor
        run: |
          az containerapp update \
            --name bioma-blazor \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.REGISTRY }}/${{ needs.build-and-push.outputs.owner }}/bioma-blazor:${{ github.sha }}
